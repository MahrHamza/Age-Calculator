<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Animated background -->
  <div class="bg" aria-hidden="true">
    <span class="orb o1"></span>
    <span class="orb o2"></span>
    <span class="orb o3"></span>
    <div class="grid"></div>
    <canvas id="stars"></canvas>
  </div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="app">
    <header class="top rise" style="--d:0">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path class="hand" d="M12 12V6.5"/>
            <path class="hand slow" d="M12 12l3.5 2"/>
          </svg>
        </div>
        <div>
          <h1>Age Calculator</h1>
          <p class="sub">Find your exact age in years, months and days.</p>
        </div>
      </div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle light and dark mode">
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <section class="card glass rise" id="card" style="--d:1">
      <form id="form" novalidate>
        <div class="fields">
          <label class="field">
            <span>Date of birth</span>
            <input type="date" id="dob" required>
          </label>
          <label class="field">
            <span class="field-head">Age on date
              <button type="button" class="auto-tag is-auto" id="autoTag" title="Use today's date">Auto: today</button>
            </span>
            <input type="date" id="target">
          </label>
        </div>
        <p class="error" id="error" role="alert"></p>
        <div class="actions">
          <button type="submit" class="btn primary"><span>Calculate age</span></button>
          <button type="button" class="btn ghost" id="resetBtn"><span>Reset</span></button>
        </div>
      </form>
    </section>

    <section class="result glass" id="result" hidden>
      <div class="dial-wrap item">
        <svg class="dial" viewBox="0 0 240 240" aria-hidden="true">
          <defs>
            <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"/>
              <stop offset="55%"/>
              <stop offset="100%"/>
            </linearGradient>
          </defs>
          <g id="ticks"></g>
          <circle class="track" cx="120" cy="120" r="92"/>
          <circle class="arc" id="arc" cx="120" cy="120" r="92"/>
          <g class="orbit" id="orbit"><circle class="dot" cx="120" cy="28" r="6.5"/></g>
        </svg>
        <div class="dial-center">
          <b id="years">0</b>
          <span>Years old</span>
        </div>
      </div>

      <div class="chips">
        <div class="chip item"><b id="months">0</b><span>Months</span></div>
        <div class="chip item"><b id="days">0</b><span>Days</span></div>
      </div>

      <div class="stats">
        <div class="stat item"><span>Total months</span><b id="totMonths">0</b></div>
        <div class="stat item"><span>Total weeks</span><b id="totWeeks">0</b></div>
        <div class="stat item"><span>Total days</span><b id="totDays">0</b></div>
        <div class="stat item"><span>Total hours</span><b id="totHours">0</b></div>
      </div>

      <div class="birthday item">
        <div class="b-top">
          <div>
            <span class="label">Next birthday</span>
            <p id="nextDate">—</p>
          </div>
          <div class="count"><b id="daysLeft">0</b><span>days to go</span></div>
        </div>
        <div class="bar"><i id="barFill"></i></div>
        <p class="pct" id="pctText"></p>
      </div>
      <p class="born item" id="bornOn"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
